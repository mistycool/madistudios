<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MADI Studios – Animated Background</title>
  <style>
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      width: 100vw; height: 100vh;
      background: #191827;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #FFDC7C;
    }
    #canvas {
      position: fixed;
      left: 0; top: 0; width: 100vw; height: 100vh; z-index: -1;
    }
    #cover {
      width: 100vw; height: 100vh;
      position: fixed; top: 0; left: 0;
      background: #191827fa;
      display: flex; flex-direction:column; align-items:center; justify-content:center; z-index:2;
    }
    #cover h1 { color: #FFC800; font-size:2.2em; margin-bottom:0.6em; }
    #cover p { color: #FFEFB3; font-size: 1.3em; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="cover">
  <h1>MADI Studios</h1>
  <p>Click anywhere to enter<br>and enjoy the music...</p>
</div>
<audio id="audio" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/08/audio_3588543a00.mp3" type="audio/mp3" />
</audio>
<script>
  // Set up canvas and floating animated notes
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resizeCanvas); resizeCanvas();

  // Array of floating music notes (unicode)
  class Note {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = canvas.height + (Math.random() * 200);
      this.size = 32 + Math.random() * 26;
      this.speed = 0.4 + Math.random() * 0.8;
      this.char = ["\u266A","\u266B","\u266C","\u2669"][Math.floor(Math.random()*4)];
      this.alpha = 0.18 + Math.random()*0.23;
      this.color = `rgba(176,240,255,${this.alpha})`;
      this.phase = Math.random() * 10;
    }
    draw(level) {
      ctx.save();
      ctx.font = `${this.size+(level*38)}px Arial`;
      ctx.shadowColor = "#B6DEFC";
      ctx.shadowBlur = 9 + level*22;
      ctx.fillStyle = this.color;
      ctx.globalAlpha = this.alpha + level*0.18;
      ctx.fillText(this.char, this.x, this.y);
      ctx.restore();
    }
    update(level) {
      this.y -= (this.speed + level*1.8);
      this.x += Math.sin(this.phase + Date.now()/2800.0) * 0.72;
      if(this.y < -60) this.reset();
    }
  }
  let notes = Array.from({length: 35}, () => new Note());

  // Audio analysis variables
  let audioCtx, analyzer, src, level = 0;
  const audioEl = document.getElementById('audio');
  let started = false;

  // Analysis + launch animation
  function setup() {
    if (started) return;
    started = true;
    document.getElementById('cover').style.display = "none";
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    analyzer = audioCtx.createAnalyser();
    src = audioCtx.createMediaElementSource(audioEl);
    src.connect(analyzer);
    analyzer.connect(audioCtx.destination);
    analyzer.fftSize = 32;
    audioEl.play();
    animate();
  }
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // Analyze audio energy
    if(analyzer){
      let arr = new Uint8Array(analyzer.frequencyBinCount);
      analyzer.getByteFrequencyData(arr);
      level = arr.reduce((a,b)=>a+b,0)/arr.length/255;
    }
    notes.forEach(n=>{ n.update(level); n.draw(level); });
    requestAnimationFrame(animate);
  }
  // Overlay triggers audio context and animation
  document.getElementById('cover').addEventListener('click', setup);
</script>
</body>
</html>
